# One-week portfolio preview. Render Free Postgres expires after 30 days.
# Upgrade both plans or move the database before long-term use.
services:
  - type: web
    name: signal-desk-demo
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: off
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: signal-desk-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: REGISTRATION_CODE
        sync: false
      - key: SYNC_IN_WEB
        value: "true"

databases:
  - name: signal-desk-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
