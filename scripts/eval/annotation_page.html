<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>阅讯 · 偏好标注</title>
<style>body{margin:0;background:#f5f4f0;color:#26382c;font:16px/1.8 -apple-system,'PingFang SC',sans-serif}main{max-width:820px;margin:35px auto;padding:0 22px 45px}h1{font-size:25px}h2{font-size:22px;line-height:1.5}small,.muted{color:#69776a}article{background:white;border:1px solid #d9ded6;padding:25px;border-radius:8px}button,select{font:inherit;padding:9px 14px;border:1px solid #bdcbbf;border-radius:5px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}button.active{background:#315a43;color:white}nav,.choices,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}textarea{width:100%;box-sizing:border-box;min-height:75px;font:inherit;padding:10px}a{color:#315a43}progress{width:100%;height:10px}.notice{font-size:14px}#status{min-height:25px}label{display:block;margin-top:18px}button:focus-visible,a:focus-visible{outline:3px solid #80a68d}#summary{white-space:pre-wrap}</style>
<main><h1>给阅讯 30 次真实判断</h1><p class="notice">按你对<strong>这条内容本身</strong>的兴趣判断。样本来自历史库存，请暂时忽略日期较早这件事。没有正确答案，不想看的内容同样有价值。</p><p class="notice muted">包含通鼎互联、辉煌科技、CS2；本批没有专门的绿龙新闻。只判断标题和已有短摘录，想进一步确认可以打开原文；证据不足请选择“无法判断”。兴趣标签不等于事实核验。</p><progress id="progress" max="30" value="0"></progress><p id="summary"></p><div class="toolbar"><select id="filter" aria-label="筛选"><option value="all">全部</option><option value="pending">未完成</option></select><button id="export">导出结果 JSON</button><label>导入之前的进度 <input id="import" type="file" accept="application/json,.json"></label></div><p id="status" role="status"></p><label id="export-label" hidden>导出内容（下载失败时可以复制保存）<textarea id="export-text" readonly style="min-height:150px" aria-label="导出结果内容"></textarea></label><article><small id="meta"></small><h2 id="title"></h2><p id="excerpt"></p><a id="link" target="_blank" rel="noopener noreferrer">打开原文 ↗</a><div class="choices"><button data-value="1">想看</button><button data-value="0">不想看</button><button data-value="skip">无法判断</button></div><label for="note">原因（选填，比如：不关注版本更新、更想看选手动态）</label><textarea id="note" maxlength="300"></textarea><nav><button id="prev">上一篇</button><button id="next">下一篇</button><button id="pending">下一个未完成</button></nav></article><p class="muted notice">进度只存在此浏览器的本地存储，不发送到模型或线上服务。选完请导出 JSON 保存；清除浏览器数据会丢失本地进度。冻结样本预先划分反馈与评估两组，评估组标签不参与调整排序。</p></main>
<script id="manifest" type="application/json">__MANIFEST__</script><script>
const manifest=JSON.parse(document.getElementById('manifest').textContent),items=manifest.items,key='signal-desk-labels-v1-'+manifest.corpus_id,names={'stock:002491':'通鼎互联','stock:002296':'辉煌科技','esports:cs2':'CS2'};let labels={},index=0,storageOK=true;
const $=id=>document.getElementById(id);const message=t=>$('status').textContent=t;
try{labels=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){storageOK=false;message('本地存储不可用，请及时导出结果。')}
function save(){try{localStorage.setItem(key,JSON.stringify(labels))}catch(e){storageOK=false;message('本地存储保存失败，请导出结果避免丢失。')}}
function visible(){return items.map((_,i)=>i).filter(i=>$('filter').value!=='pending'||!labels[items[i].item_id])}
function render(){const row=items[index],entry=labels[row.item_id];$('title').textContent=row.title;$('excerpt').textContent=row.summary||'当前仅收录标题，没有正文摘录。';$('meta').textContent=`第 ${index+1} / ${items.length} 篇 · ${names[row.watch_id]} · ${(row.published_at||'未知日期').slice(0,10)}`;const url=new URL(row.url);$('link').hidden=!['https:','http:'].includes(url.protocol);$('link').href=$('link').hidden?'#':url.href;$('note').value=entry?.notes||'';document.querySelectorAll('[data-value]').forEach(b=>{b.classList.toggle('active',String(entry?.preference)===b.dataset.value);b.setAttribute('aria-pressed',String(String(entry?.preference)===b.dataset.value))});const done=items.filter(r=>labels[r.item_id]).length,judged=items.filter(r=>[0,1].includes(labels[r.item_id]?.preference)).length;$('progress').value=done;$('summary').textContent=`已处理 ${done}/30 · 有效兴趣判断 ${judged} · 无法判断 ${done-judged}`;$('prev').disabled=index===0;$('next').disabled=index===items.length-1;}
document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{const row=items[index];labels[row.item_id]={preference:b.dataset.value==='skip'?'skip':Number(b.dataset.value),notes:$('note').value,annotated_at:new Date().toISOString()};save();render()});
$('note').oninput=()=>{const entry=labels[items[index].item_id];if(entry){entry.notes=$('note').value;save()}};
$('next').onclick=()=>{const next=visible().find(i=>i>index);if(next!==undefined)index=next;render()};$('prev').onclick=()=>{const prev=visible().filter(i=>i<index).pop();if(prev!==undefined)index=prev;render()};$('pending').onclick=()=>{const pending=items.map((r,i)=>({r,i})).filter(x=>!labels[x.r.item_id]);const next=pending.find(x=>x.i>index)||pending[0];if(next){index=next.i;render()}else message('全部处理完成，请导出结果 JSON。')};$('filter').onchange=()=>{if(!visible().includes(index)&&visible().length)index=visible()[0];render()};
$('export').onclick=()=>{const result={version:1,corpus_id:manifest.corpus_id,annotator_id:'reader-1',label_kind:'historical_content_preference',exported_at:new Date().toISOString(),labels:items.filter(r=>labels[r.item_id]).map(r=>({item_id:r.item_id,...labels[r.item_id]}))};$('export-label').hidden=false;$('export-text').value=JSON.stringify(result,null,2);const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='signal-desk-preferences-'+manifest.corpus_id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('结果已导出。请保留文件，完成后交给我生成报告。')};
$('import').onchange=async()=>{try{const file=$('import').files[0];if(!file)return;if(file.size>1000000)throw Error('文件过大');const data=JSON.parse(await file.text());if(data.corpus_id!==manifest.corpus_id||!Array.isArray(data.labels))throw Error('不是这批样本的标注文件');const imported={},seen=new Set();for(const row of data.labels){if(!items.some(i=>i.item_id===row.item_id)||seen.has(row.item_id)||![0,1,'skip'].includes(row.preference)||typeof row.notes!=='string'||row.notes.length>300)throw Error('标注格式不合法');seen.add(row.item_id);imported[row.item_id]={preference:row.preference,notes:row.notes,annotated_at:row.annotated_at}}labels={...labels,...imported};save();render();message('已合并进度。')}catch(e){message('导入失败：'+e.message)}};render();
</script></html>
