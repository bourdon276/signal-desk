[project]
name = "personal-info-agent"
version = "0.1.0"
description = "个性化资讯采集、去重与推荐 Agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "feedparser>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "nanobot-ai==0.3.5",
    "pydantic-settings>=2.8,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/information_agent"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
